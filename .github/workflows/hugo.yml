# Publica el sitio Hugo en GitHub Pages (https://hmvsoluciones.github.io/ctctelecom.mx/).
# El sitio usa rutas absolutas (/assets/..., /datos/...) porque está pensado para
# la raíz de un dominio; en Pages vive bajo el subpath /ctctelecom.mx/, así que
# después de compilar se reescriben esas rutas con el prefijo del subpath.
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --cleanDestinationDir \
            --gc \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Rewrite root-relative URLs for the /ctctelecom.mx subpath
        run: |
          find public -name '*.html' -exec perl -pi -e 's#((?:src|href|poster|action)="/)(?!ctctelecom\.mx/)#${1}ctctelecom.mx/#g; s#(url\([\x27"]?/)(?!ctctelecom\.mx/)#${1}ctctelecom.mx/#g; s#(srcset="/)(?!ctctelecom\.mx/)#${1}ctctelecom.mx/#g; s#(,\s*/)(?!ctctelecom\.mx/)#${1}ctctelecom.mx/#g' {} +
          test -z "$(grep -rP '(src|href|poster|action)="/(?!ctctelecom\.mx/)' public --include='*.html' || true)"
                    test -z "$(grep -rP 'srcset="/(?!ctctelecom\.mx/)' public --include='*.html' || true)"
                              test -z "$(grep -rP ',\s*/(?!ctctelecom\.mx/)assets/' public --include='*.html' || true)"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
