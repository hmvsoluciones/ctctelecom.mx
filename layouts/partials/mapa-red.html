<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de red</title>
<style>
  :root{--bg:#060a12;--bg2:#0d1526;--land:#26365a;--link:#2b3b66;--cy:#3df2ff;--vi:#a98bff;--am:#ffb44a;--tx:#c9d4ee}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--tx);font:13px/1.4 "Trebuchet MS","Segoe UI",sans-serif}
  .wrap{position:relative;width:100%;max-width:1400px;margin:0 auto;aspect-ratio:2.35/1;min-height:320px;
    background:radial-gradient(120% 90% at 30% 40%,var(--bg2),var(--bg));overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .panel{position:absolute;left:14px;bottom:14px;padding:10px 14px;background:rgba(6,10,18,.72);
    backdrop-filter:blur(6px);border:1px solid #26365a;border-radius:10px;display:grid;gap:5px;font-size:12px}
  .panel i{display:inline-block;width:18px;vertical-align:middle;margin-right:8px}
  .st{position:absolute;right:14px;top:12px;text-align:right;font-size:12px;opacity:.9}
  .st b{color:var(--cy);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .tip{position:absolute;pointer-events:none;padding:5px 9px;background:#0b1224;border:1px solid var(--cy);
    border-radius:6px;font-size:12px;opacity:0;transition:opacity .15s;white-space:nowrap}
  @media(max-width:640px){.wrap{aspect-ratio:1.5/1}.panel{display:none}}
</style>
</head>
<body>
<div class="wrap" id="w">
  <canvas id="c" aria-label="Mapa animado de la red con paquetes viajando entre nodos" role="img"></canvas>
  <div class="st"><b id="n">0</b> paquetes en tránsito<br><span id="ms">—</span></div>
  <div class="panel">
    <span><i style="height:0;border-top:2px solid var(--cy)"></i>Enlace activo</span>
    <span><i style="height:0;border-top:2px dashed var(--am)"></i>Enlace internacional</span>
    <span><svg width="18" height="12" style="margin-right:8px;vertical-align:middle"><path d="M9 1l7 10H2z" fill="#ffb44a"/></svg>POP</span>
    <span><i style="height:9px;width:9px;border-radius:50%;background:var(--cy)"></i>Red metropolitana</span>
  </div>
  <div class="tip" id="tip"></div>
</div>
<script>
(() => {
  // ---- Datos: [id, nombre, lon, lat, tipo] tipo: p = POP, m = metropolitana, x = internacional
  const N = [
    ['LA','Los Ángeles',-118.2,34.0,'p'],['PHX','Phoenix',-112,33.4,'p'],['ELP','El Paso',-106.4,31.8,'p'],
    ['DAL','Dallas',-96.8,32.8,'p'],['MCA','McAllen',-98.2,26.2,'p'],['MIA','Miami',-80.2,25.8,'p'],
    ['EPS','Eagle Pass',-100.5,28.7,'p'],['AS','Asia',-128,29,'x'],['EU','Europa',-76,31.5,'x'],
    ['TIJ','Tijuana',-117,32.5,'m'],['ENS','Ensenada',-116.6,31.9,'m'],['NOG','Nogales',-110.9,31.3,'m'],
    ['HER','Hermosillo',-111,29.1,'m'],['JUA','Cd. Juárez',-106.5,31.7,'m'],['CHI','Chihuahua',-106.1,28.6,'p'],
    ['ACU','Cd. Acuña',-100.9,29.3,'m'],['MON','Monclova',-101.4,26.9,'m'],['TOR','Torreón',-103.4,25.5,'m'],
    ['MTY','Monterrey',-100.3,25.7,'p'],['REY','Reynosa',-98.3,26.1,'m'],['MAT','Matamoros',-97.5,25.9,'m'],
    ['TAM','Tampico',-97.9,22.3,'m'],['SLP','San Luis Potosí',-101,22.1,'m'],['ZAC','Zacatecas',-102.6,22.8,'m'],
    ['CUL','Culiacán',-107.4,24.8,'m'],['MAZ','Mazatlán',-106.4,23.2,'m'],['TEP','Tepic',-104.9,21.5,'m'],
    ['GDL','Guadalajara',-103.3,20.7,'p'],['LEO','León',-101.7,21.1,'m'],['QRO','Querétaro',-100.4,20.6,'m'],
    ['CDMX','CDMX',-99.1,19.4,'p'],['PUE','Puebla',-98.2,19.0,'m'],['VER','Veracruz',-96.1,19.2,'m'],
    ['MOR','Morelia',-101.2,19.7,'m'],['LC','Lázaro Cárdenas',-102.2,17.9,'m'],['ACA','Acapulco',-99.9,16.9,'m'],
    ['OAX','Oaxaca',-96.7,17.1,'m'],['TUX','Tuxtla',-93.1,16.8,'m'],['VIL','Villahermosa',-92.9,18.0,'m'],
    ['MER','Mérida',-89.6,21.0,'m'],['CAN','Cancún',-86.8,21.2,'m'],['LPZ','La Paz',-110.3,24.1,'m'],['CAB','Los Cabos',-109.9,22.9,'m']
  ];
  const E = `LA-TIJ TIJ-ENS LA-PHX PHX-NOG NOG-HER HER-CUL CUL-MAZ MAZ-TEP TEP-GDL MAZ-LPZ LPZ-CAB LA-ELP PHX-ELP ELP-JUA JUA-CHI
  CHI-TOR TOR-MON MON-MTY MTY-REY REY-MAT MCA-REY ACU-EPS EPS-MON MTY-SLP TOR-ZAC ZAC-SLP SLP-TAM SLP-QRO QRO-CDMX GDL-LEO LEO-QRO
  GDL-MOR MOR-CDMX CDMX-PUE PUE-VER VER-TAM VER-OAX PUE-OAX OAX-TUX TUX-VIL VER-VIL VIL-MER MER-CAN MOR-LC LC-ACA ACA-CDMX ZAC-GDL
  DAL-ELP DAL-MCA DAL-MIA DAL-LA DAL-EPS MCA-MIA MTY-TAM MTY-MCA AS-LA AS-TIJ EU-MIA EU-DAL`.split(/\s+/).map(s => s.split('-'));

  // ---- Contorno aproximado (lon,lat) para generar el mapa de puntos
  const MX = [[-117.1,32.5],[-114.7,32.7],[-111.1,31.3],[-108.2,31.3],[-108.2,31.8],[-106.5,31.8],[-104.9,30.6],[-104.5,29.6],[-103.1,29],[-102.4,29.8],[-101.4,29.8],[-100.7,29.1],[-99.5,27.5],[-99.1,26.4],[-97.4,25.9],[-97.7,24.3],[-97.8,22.5],[-97.2,20.6],[-96.4,19.2],[-95.2,18.7],[-94.4,18.1],[-92.5,18.6],[-91.5,18.5],[-90.5,19.5],[-90.4,21],[-88.2,21.5],[-87,21.5],[-87.5,19.5],[-88.3,18.5],[-88.9,17.9],[-90.4,17.8],[-91.4,17.3],[-92.1,16.2],[-92.2,14.6],[-94,16],[-95.5,15.9],[-97.5,15.9],[-99.5,16.7],[-101.5,17.8],[-103.5,18.3],[-105.2,20.2],[-105.5,21.5],[-106,22.8],[-108,25],[-109.4,26.8],[-111,28],[-112.4,29.7],[-113.1,31.2],[-114.8,31.8]];
  const BAJA = [[-117.1,32.5],[-116,30.8],[-114.7,28],[-114,27],[-112,24.8],[-110.3,23],[-109.5,23.2],[-110,24.2],[-111,25.7],[-112.5,28],[-113.2,29.5],[-114.7,31.2],[-115,32.7]];
  const US = [[-124.5,34.4],[-117.1,32.5],[-114.7,32.7],[-111.1,31.3],[-108.2,31.3],[-108.2,31.8],[-106.5,31.8],[-104.9,30.6],[-104.5,29.6],[-103.1,29],[-102.4,29.8],[-101.4,29.8],[-100.7,29.1],[-99.5,27.5],[-99.1,26.4],[-97.4,25.9],[-97,27.5],[-94,29.5],[-90,29],[-86,30.2],[-84,30],[-82.8,27.8],[-81.2,25.2],[-80.2,25.5],[-80,27],[-80,36],[-124.5,36]];

  const LON0 = -131, LON1 = -74, LAT0 = 13, LAT1 = 36;
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  const wrap = document.getElementById('w'), tip = document.getElementById('tip');
  const byId = {}; N.forEach(n => byId[n[0]] = { id:n[0], name:n[1], lon:n[2], lat:n[3], t:n[4], adj:[], pulse:Math.random()*6 });
  let W, H, DPR, land = [];
  const P = n => ({ x:(n.lon-LON0)/(LON1-LON0)*W, y:(LAT1-n.lat)/(LAT1-LAT0)*H });
  const inside = (pt, poly) => { let c = false;
    for (let i=0,j=poly.length-1;i<poly.length;j=i++){
      const [xi,yi]=poly[i],[xj,yj]=poly[j];
      if ((yi>pt[1])!==(yj>pt[1]) && pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi) c=!c; } return c; };

  // ---- Enlaces con curvatura
  const links = E.map(([a,b],i) => {
    byId[a].adj.push(b); byId[b].adj.push(a);
    const intl = byId[a].t==='x' || byId[b].t==='x';
    return { a:byId[a], b:byId[b], intl, bow:(i%2?1:-1)*(intl?0.22:0.1), heat:0 };
  });
  const linkOf = (a,b) => links.find(l => (l.a.id===a&&l.b.id===b)||(l.a.id===b&&l.b.id===a));
  const ctrl = l => { const A=l.a.p,B=l.b.p; return { x:(A.x+B.x)/2-(B.y-A.y)*l.bow, y:(A.y+B.y)/2+(B.x-A.x)*l.bow }; };
  const bez = (l, t, rev) => { const A=rev?l.b.p:l.a.p, B=rev?l.a.p:l.b.p, C=l.c, u=1-t;
    return { x:u*u*A.x+2*u*t*C.x+t*t*B.x, y:u*u*A.y+2*u*t*C.y+t*t*B.y }; };

  function layout(){
    DPR = Math.min(devicePixelRatio||1, 2);
    W = wrap.clientWidth; H = wrap.clientHeight;
    cv.width = W*DPR; cv.height = H*DPR; cx.setTransform(DPR,0,0,DPR,0,0);
    Object.values(byId).forEach(n => n.p = P(n));
    links.forEach(l => l.c = ctrl(l));
    // Mapa de puntos
    land = []; const step = Math.max(5, W/190);
    for (let y=step/2; y<H; y+=step) for (let x=step/2; x<W; x+=step){
      const lon = LON0 + x/W*(LON1-LON0), lat = LAT1 - y/H*(LAT1-LAT0);
      const mx = inside([lon,lat],MX) || inside([lon,lat],BAJA);
      const us = !mx && inside([lon,lat],US);
      if (mx || us) land.push([x,y,mx]);
    }
    land.step = step;
  }

  // ---- Paquetes: viajan salto a salto por la ruta más corta
  const route = (s, d) => { const q=[[s]], seen={[s]:1};
    while (q.length){ const p=q.shift(), last=p[p.length-1]; if(last===d) return p;
      for (const nx of byId[last].adj) if(!seen[nx]){ seen[nx]=1; q.push([...p,nx]); } } return [s]; };
  const pops = N.filter(n => n[4]!=='m').map(n => n[0]), all = N.map(n => n[0]);
  const pk = [];
  const rnd = a => a[Math.random()*a.length|0];
  function spawn(){
    let s = rnd(Math.random()<.6?pops:all), d = rnd(Math.random()<.7?all:pops);
    if (s===d) return;
    const path = route(s,d); if (path.length<2) return;
    const intl = path.some(id => byId[id].t==='x');
    pk.push({ path, i:0, t:0, trail:[], color: intl?'#ffb44a':(Math.random()<.35?'#a98bff':'#3df2ff'), spd:(0.5+Math.random()*0.6) });
  }

  // ---- Dibujo
  let last = performance.now(), acc = 0, hover = null;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const small = () => W < 700;
  function frame(now){
    const dt = Math.min(.05,(now-last)/1000); last = now;
    cx.clearRect(0,0,W,H);
    // tierra
    const r = land.step*.2;
    for (const [x,y,mx] of land){ cx.fillStyle = mx ? '#31457a' : '#16213a'; cx.fillRect(x-r,y-r,r*2,r*2); }
    // enlaces
    for (const l of links){
      l.heat = Math.max(0, l.heat - dt*0.6);
      cx.beginPath(); cx.moveTo(l.a.p.x,l.a.p.y); cx.quadraticCurveTo(l.c.x,l.c.y,l.b.p.x,l.b.p.y);
      cx.setLineDash(l.intl?[5,6]:[]); cx.lineWidth = 1;
      cx.strokeStyle = l.intl ? 'rgba(255,180,74,.35)' : '#2b3b66'; cx.stroke();
      if (l.heat>0.02){ cx.lineWidth = 1.5+l.heat*2; cx.strokeStyle = (l.intl?'rgba(255,180,74,':'rgba(61,242,255,')+l.heat*.9+')'; cx.stroke(); }
    }
    cx.setLineDash([]);
    // paquetes
    if (!reduce){ acc += dt; while (acc > 0.14){ acc -= 0.14; if (pk.length<70) spawn(); } }
    for (let k=pk.length-1;k>=0;k--){
      const p = pk[k], a = p.path[p.i], b = p.path[p.i+1], l = linkOf(a,b), rev = l.a.id!==a;
      const len = Math.hypot(l.b.p.x-l.a.p.x, l.b.p.y-l.a.p.y)+1;
      p.t += dt*p.spd*Math.max(60,W*.12)/len; l.heat = 1;
      if (p.t>=1){ p.t = 0; p.i++; if (p.i>=p.path.length-1){ byId[p.path[p.i]].pulse = 0; pk.splice(k,1); continue; } }
      const pos = bez(l,p.t,rev); p.trail.push(pos); if (p.trail.length>16) p.trail.shift();
      for (let j=0;j<p.trail.length;j++){ const q=p.trail[j], f=j/p.trail.length;
        cx.globalAlpha = f*.7; cx.fillStyle = p.color; cx.beginPath(); cx.arc(q.x,q.y,.6+f*1.8,0,7); cx.fill(); }
      cx.globalAlpha = 1; cx.shadowColor = p.color; cx.shadowBlur = 10; cx.fillStyle = '#fff';
      cx.beginPath(); cx.arc(pos.x,pos.y,2.2,0,7); cx.fill(); cx.shadowBlur = 0;
    }
    // nodos
    const fs = small()?9:11; cx.font = fs+'px "Trebuchet MS",sans-serif'; cx.textBaseline = 'middle';
    for (const n of Object.values(byId)){
      n.pulse += dt; const {x,y} = n.p, col = n.t==='x'?'#ffb44a':(n.t==='p'?'#ffb44a':'#3df2ff');
      const ring = (n.pulse%3)/3;
      if (n.t!=='m'){ cx.strokeStyle = col; cx.globalAlpha = (1-ring)*.5; cx.beginPath(); cx.arc(x,y,4+ring*14,0,7); cx.stroke(); cx.globalAlpha = 1; }
      cx.fillStyle = col; cx.shadowColor = col; cx.shadowBlur = 8;
      cx.beginPath();
      if (n.t==='m'){ cx.arc(x,y,3,0,7); }
      else { cx.moveTo(x,y-6); cx.lineTo(x+6,y+4); cx.lineTo(x-6,y+4); cx.closePath(); }
      cx.fill(); cx.shadowBlur = 0;
      if (n.t==='x'){ cx.font = '600 '+(small()?16:24)+'px "Trebuchet MS",sans-serif'; cx.fillStyle='#e4ebff'; cx.fillText(n.name,x+(n.id==='AS'?-8:-40),y+(n.id==='AS'?-22:-22)); cx.font = fs+'px "Trebuchet MS",sans-serif'; }
      else if (n.t==='p' || (!small() && W>900) || hover===n){ cx.fillStyle = hover===n?'#fff':'#9db0da'; cx.fillText(n.name,x+8,y); }
    }
    document.getElementById('n').textContent = pk.length;
    if (!(now%7<1)) document.getElementById('ms').textContent = 'latencia media ' + (18+((now/900|0)%7)) + ' ms';
    requestAnimationFrame(frame);
  }

  // ---- Interacción
  cv.addEventListener('pointermove', e => {
    const b = cv.getBoundingClientRect(), mx = e.clientX-b.left, my = e.clientY-b.top; hover = null;
    for (const n of Object.values(byId)) if (Math.hypot(n.p.x-mx,n.p.y-my)<10) hover = n;
    if (hover){ tip.textContent = hover.name+' · '+({p:'POP',m:'Red metropolitana',x:'Enlace internacional'})[hover.t];
      tip.style.left = Math.min(mx+12,W-190)+'px'; tip.style.top = (my+12)+'px'; tip.style.opacity = 1; } else tip.style.opacity = 0;
  });
  cv.addEventListener('pointerleave', () => { hover = null; tip.style.opacity = 0; });
  cv.addEventListener('click', () => { if (hover) for (let i=0;i<6;i++){ const d = rnd(all); if (d!==hover.id){ const path = route(hover.id,d); if (path.length>1) pk.push({path,i:0,t:0,trail:[],color:'#fff',spd:1}); } } });

  new ResizeObserver(layout).observe(wrap); layout();
  for (let i=0;i<25;i++) spawn();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
